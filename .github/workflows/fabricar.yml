name: Fábrica de vídeos

on:
  push:
    branches: [main]
    paths: ['fabrica/cola/**']
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Solo prueba de montaje (vuelve a montar lo ya hecho y compara; no escribe nada)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fabrica
  cancel-in-progress: false

jobs:
  fabricar:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: fabrica/requirements.txt
      - name: ffmpeg (apt)
        id: apt
        continue-on-error: true
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends ffmpeg
      - name: ffmpeg (estático, si apt falla o se cuelga)
        if: steps.apt.outcome != 'success'
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          curl -sSL --retry 3 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
            | tar xJ -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
      - name: Dependencias
        run: pip install -q -r fabrica/requirements.txt
      - name: Prueba de montaje
        if: ${{ inputs.prueba }}
        run: python fabrica/procesar.py --prueba
      - name: Fabricar
        if: ${{ !inputs.prueba }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python fabrica/procesar.py
      - name: Guardar en el repo
        if: ${{ !inputs.prueba && always() }}
        run: |
          git config user.name "fabrica-don-bigotes"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lote-* fabrica
          if git diff --cached --quiet; then echo "Nada nuevo"; exit 0; fi
          git commit -q -m "Fábrica: vídeos y registro [skip ci]"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
