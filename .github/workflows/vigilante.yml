name: Vigilante de la fábrica

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  vigilar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Revisar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 fabrica/vigilante.py
